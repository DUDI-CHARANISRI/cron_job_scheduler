spring.application.name=cron-scheduler
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.h2.console.enabled=true
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/cron_scheduler}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.graphql.graphiql.enabled=true
spring.graphql.schema.locations=classpath:graphql/
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.enabled=${APP_KAFKA_ENABLED:false}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
server.port=${SERVER_PORT:8080}
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store-type=PKCS12
server.ssl.key-store=${SERVER_SSL_KEYSTORE:classpath:keystore/cron-demo.p12}
server.ssl.key-store-password=${SERVER_SSL_KEYSTORE_PASSWORD:}
logging.level.root=INFO
logging.level.com.example.cron_scheduler=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [requestId=%X{requestId}] [%thread] %logger{36} - %msg%n
app.oauth.enabled=${APP_OAUTH_ENABLED:false}
# OAuth is opt-in through application-oauth.properties and real environment values.
app.security.admin.username=${ADMIN_USERNAME:}
app.security.admin.password-hash=${ADMIN_PASSWORD_HASH:}
app.security.operator.username=${OPERATOR_USERNAME:}
app.security.operator.password-hash=${OPERATOR_PASSWORD_HASH:}
