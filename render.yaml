services:
  - type: web
    name: cron-job-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: OPERATOR_USERNAME
        sync: false
      - key: OPERATOR_PASSWORD_HASH
        sync: false
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:file:./data/cron_scheduler
      - key: SPRING_DATASOURCE_USERNAME
        value: sa
      - key: SPRING_DATASOURCE_PASSWORD
        value: ""
  - type: web
    name: action-runner
    runtime: docker
    dockerfilePath: ./action-runner/Dockerfile
    plan: free
    envVars:
      - key: SERVER_PORT
        value: 8082
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
